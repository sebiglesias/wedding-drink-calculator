<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="cocktailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#27272a" stroke-width="6"/>

  <!-- Party Drink Glasses Silhouette -->
  <!-- Beer / Highball Glass (Left) -->
  <path d="M140 180 L160 380 C162 400, 178 415, 200 415 L210 415 C232 415, 248 400, 250 380 L270 180 Z" fill="#27272a" stroke="#3f3f46" stroke-width="4"/>
  <path d="M148 240 L163 378 C165 390, 175 400, 190 400 L220 400 C235 400, 245 390, 247 378 L262 240 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <!-- Beer Foam Head -->
  <ellipse cx="205" cy="235" rx="58" ry="14" fill="#ffffff" opacity="0.95"/>
  <ellipse cx="180" cy="225" rx="20" ry="12" fill="#ffffff"/>
  <ellipse cx="230" cy="228" rx="24" ry="12" fill="#ffffff"/>

  <!-- Cocktail Coupe / Martini Glass (Right) -->
  <g transform="translate(40, -10)">
    <!-- Base -->
    <ellipse cx="280" cy="415" rx="45" ry="10" fill="#3f3f46"/>
    <!-- Stem -->
    <rect x="276" y="300" width="8" height="115" rx="4" fill="#52525b"/>
    <!-- Bowl -->
    <path d="M210 200 C210 280, 350 280, 350 200 Z" fill="#27272a" stroke="#3f3f46" stroke-width="4"/>
    <path d="M218 215 C225 270, 335 270, 342 215 Z" fill="url(#cocktailGrad)"/>
    <!-- Lime Wheel Slice -->
    <circle cx="345" cy="195" r="28" fill="#84cc16"/>
    <circle cx="345" cy="195" r="23" fill="#a3e635"/>
    <circle cx="345" cy="195" r="5" fill="#ffffff"/>
  </g>

  <!-- Ice Cubes Floating Accent -->
  <rect x="180" y="270" width="26" height="26" rx="6" fill="#ffffff" opacity="0.5" transform="rotate(15 180 270)"/>
  <rect x="205" y="320" width="22" height="22" rx="5" fill="#ffffff" opacity="0.4" transform="rotate(-20 205 320)"/>

  <!-- Festive Bubbles -->
  <circle cx="160" cy="140" r="8" fill="#ec4899" opacity="0.8"/>
  <circle cx="280" cy="130" r="12" fill="#eab308" opacity="0.8"/>
  <circle cx="360" cy="120" r="6" fill="#38bdf8" opacity="0.8"/>
</svg>
